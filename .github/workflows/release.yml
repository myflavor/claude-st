name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # tag/ext reproduce the original naming: the linux-amd64 and
          # windows-amd64 builds carry no platform tag; others do.
          - { os: linux,   arch: amd64, tag: '',              ext: '' }
          - { os: linux,   arch: arm64, tag: '-linux-arm64',  ext: '' }
          - { os: darwin,  arch: amd64, tag: '-darwin-amd64', ext: '' }
          - { os: darwin,  arch: arm64, tag: '-darwin-arm64', ext: '' }
          - { os: windows, arch: amd64, tag: '',              ext: '.exe' }
          - { os: windows, arch: arm64, tag: '-arm64',        ext: '.exe' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          ST: claude-st${{ matrix.target.tag }}${{ matrix.target.ext }}
          CFG: claude-cfg${{ matrix.target.tag }}${{ matrix.target.ext }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/$ST"  ./cmd/claude-st
          go build -trimpath -ldflags="-s -w" -o "dist/$CFG" ./cmd/claude-cfg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/claude-st
            dist/claude-st-linux-arm64
            dist/claude-st-darwin-amd64
            dist/claude-st-darwin-arm64
            dist/claude-st.exe
            dist/claude-st-arm64.exe
            dist/claude-cfg
            dist/claude-cfg-linux-arm64
            dist/claude-cfg-darwin-amd64
            dist/claude-cfg-darwin-arm64
            dist/claude-cfg.exe
            dist/claude-cfg-arm64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
