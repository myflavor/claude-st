name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # Each platform builds claude-st + claude-cfg and zips them together
          # as claude-cli-<os>-<arch>.zip.
          - { os: linux,   arch: amd64, ext: '' }
          - { os: linux,   arch: arm64, ext: '' }
          - { os: darwin,  arch: amd64, ext: '' }
          - { os: darwin,  arch: arm64, ext: '' }
          - { os: windows, arch: amd64, ext: '.exe' }
          - { os: windows, arch: arm64, ext: '.exe' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and zip
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          EXT: ${{ matrix.target.ext }}
        run: |
          mkdir -p stage dist
          go build -trimpath -ldflags="-s -w" -o "stage/claude-st${EXT}"  ./cmd/claude-st
          go build -trimpath -ldflags="-s -w" -o "stage/claude-cfg${EXT}" ./cmd/claude-cfg
          (cd stage && zip -r "../dist/claude-cli-${GOOS}-${GOARCH}.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -la dist/

      # Wipe any pre-existing release for this tag (e.g. when re-releasing the
      # same version) so stale assets don't linger alongside the new zip.
      - name: Delete existing release (if any)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes --repo "${GITHUB_REPOSITORY}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/claude-cli-linux-amd64.zip
            dist/claude-cli-linux-arm64.zip
            dist/claude-cli-darwin-amd64.zip
            dist/claude-cli-darwin-arm64.zip
            dist/claude-cli-windows-amd64.zip
            dist/claude-cli-windows-arm64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
